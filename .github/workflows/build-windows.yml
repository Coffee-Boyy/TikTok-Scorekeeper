name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Require signing credentials for releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw 'Signed releases require WIN_CSC_LINK (base64 PFX) and WIN_CSC_KEY_PASSWORD repository secrets.'
          }

      - name: Build portable Windows executable
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            npm run dist -- --win portable --x64 --publish never --config.forceCodeSigning=true
          } else {
            npm run dist -- --win portable --x64 --publish never
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify executable
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath dist -Filter '*.exe' -File)
          if ($executables.Count -ne 1) {
            throw "Expected exactly one portable executable in dist; found $($executables.Count)."
          }

          $executable = $executables[0]
          if ($executable.Length -lt 10MB) {
            throw "The executable is unexpectedly small: $($executable.Length) bytes."
          }

          $stream = [System.IO.File]::OpenRead($executable.FullName)
          try {
            if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) {
              throw "The build output is not a Windows executable."
            }
          } finally {
            $stream.Dispose()
          }

          Write-Output "Built $($executable.Name) ($($executable.Length) bytes)."

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $appExecutable = Join-Path 'dist/win-unpacked' 'TikTok LIVE Scorekeeper.exe'
            foreach ($file in @($appExecutable, $executable.FullName)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              if ($signature.Status -ne 'Valid') {
                throw "Release binary is not validly signed: $file ($($signature.Status))."
              }
              Write-Output "Verified Authenticode signature for $file: $($signature.SignerCertificate.Subject)"
            }
          }

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Scorekeeper-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified executable
        uses: actions/download-artifact@v8
        with:
          name: TikTok-Scorekeeper-Windows-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe --verify-tag --generate-notes --title "TikTok LIVE Scorekeeper $GITHUB_REF_NAME"
