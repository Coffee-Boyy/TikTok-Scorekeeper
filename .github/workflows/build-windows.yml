name: Build Windows executable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build portable Windows executable
        run: npm run dist -- --win portable --x64 --publish never

      - name: Verify executable
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath dist -Filter '*.exe' -File)
          if ($executables.Count -ne 1) {
            throw "Expected exactly one portable executable in dist; found $($executables.Count)."
          }

          $executable = $executables[0]
          if ($executable.Length -lt 10MB) {
            throw "The executable is unexpectedly small: $($executable.Length) bytes."
          }

          $stream = [System.IO.File]::OpenRead($executable.FullName)
          try {
            if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) {
              throw "The build output is not a Windows executable."
            }
          } finally {
            $stream.Dispose()
          }

          Write-Output "Built $($executable.Name) ($($executable.Length) bytes)."

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: TikTok-Scorekeeper-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
